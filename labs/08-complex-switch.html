<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>实验八：复杂模型机组成原理 (纯开关操作版)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --led-off: #475569;
            --led-on: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --highlight: #38bdf8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            max-width: 1250px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }
        h2 { text-align: center; color: var(--highlight); border-bottom: 2px dashed var(--border-color); padding-bottom: 15px; margin-top: 0; }
        
        .status-badge {
            display: block;
            width: fit-content;
            margin: 0 auto 20px auto;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            background: #374151;
            text-align: center;
        }

        /* 仪表盘显示区 */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            background: #000;
            padding: 15px;
            border-radius: 8px;
            border: inset 3px #444;
        }
        .display-box {
            background: #111; border: 1px solid #333; border-radius: 6px; padding: 10px; text-align: center;
        }
        .disp-title { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
        .disp-value { font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: bold; color: #10b981; }
        .disp-value.red { color: #ef4444; text-shadow: 0 0 10px #ef4444; font-size: 24px;}
        .disp-value.blue { color: #38bdf8; }

        /* 开关组布局 */
        .control-section {
            background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 15px;
        }
        .section-title {
            font-size: 13px; color: #facc15; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; text-align: center; font-weight: bold;
        }
        .switch-bank { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; }
        
        /* 物理拨码开关样式 */
        .switch-wrapper { display: flex; flex-direction: column; align-items: center; width: 30px; }
        .switch {
            width: 20px; height: 40px; background: #374151; border-radius: 3px; position: relative; cursor: pointer; border: 2px solid #000; box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }
        .toggle {
            position: absolute; width: 100%; height: 50%; background: #ef4444; bottom: 0; transition: 0.1s; border-radius: 2px;
        }
        .switch.on .toggle { bottom: 50%; background: #10b981; }
        .switch-label { font-size: 10px; color: var(--text-muted); margin-top: 5px; text-align: center; white-space: nowrap; }

        /* 按钮与日志 */
        .action-row { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .btn {
            background: #3b82f6; color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 0 #1d4ed8; transition: 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #1d4ed8; }
        .btn.clr { background: #ef4444; box-shadow: 0 4px 0 #b91c1c; }
        .btn.clr:active { box-shadow: 0 0 0 #b91c1c; }

        .sys-log {
            margin-top: 20px; background: #000; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; height: 160px; overflow-y: auto; color: #cbd5e1; border: 1px solid #333; line-height: 1.5;
        }
        .log-warn { color: #facc15; }
        .log-succ { color: #10b981; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎛️ 实验八：复杂模型机组成原理 (纯开关操作版)</h2>
    
    <div class="status-badge" id="mode-badge">当前模式: 未知 (请设置 K1-K4)</div>

    <!-- 顶端状态与寄存器显示区 -->
    <div class="dashboard">
        <div class="display-box"><div class="disp-title">微地址 (UA5-UA0)</div><div class="disp-value" id="disp-uaddr">000000</div></div>
        <div class="display-box"><div class="disp-title">程序计数器 (PC)</div><div class="disp-value blue" id="disp-pc">00 H</div></div>
        <div class="display-box"><div class="disp-title">指令寄存器 (IR)</div><div class="disp-value blue" id="disp-ir">0000 H</div></div>
        <div class="display-box"><div class="disp-title">寄存器 Ax</div><div class="disp-value" id="disp-ax">0000 H</div></div>
        <div class="display-box"><div class="disp-title">寄存器 Bx</div><div class="disp-value" id="disp-bx">0000 H</div></div>
        <div class="display-box"><div class="disp-title">寄存器 Cx</div><div class="disp-value" id="disp-cx">0000 H</div></div>
        <div class="display-box" style="grid-column: span 2;"><div class="disp-title">输出设备 (DISP)</div><div class="disp-value red" id="disp-out">----</div></div>
    </div>

    <!-- 状态与模式控制区 -->
    <div class="control-section">
        <div class="section-title">全局控制 (K1-K4) & 读写控制 (CA1-CA2)</div>
        <div class="switch-bank" id="bank-ctrl"></div>
    </div>

    <!-- 微地址输入区 -->
    <div class="control-section">
        <div class="section-title">微地址开关 (UA5 - UA0)</div>
        <div class="switch-bank" id="bank-ua"></div>
    </div>

    <!-- 机器指令/数据输入区 -->
    <div class="control-section">
        <div class="section-title">数据总线输入开关 (D15 - D0)</div>
        <div class="switch-bank" id="bank-d"></div>
    </div>

    <!-- 24位微代码输入区 -->
    <div class="control-section">
        <div class="section-title">24位微代码开关 (MS24 - MS1)</div>
        <div class="switch-bank" id="bank-ms"></div>
    </div>

    <!-- 动作按钮 -->
    <div class="action-row">
        <button class="btn clr" onclick="actionCLR()">CLR 清零</button>
        <button class="btn" onclick="actionStep()">⚡ 按【单步】</button>
    </div>

    <div class="sys-log" id="sys-log">
        <span class="log-succ">[系统就绪]</span> 实验八架构已上线。请按照实验指导书拨动开关。
    </div>
</div>

<script>
    // --- 硬件状态存储 ---
    let state = {
        K: [0, 0, 0, 0],       
        CA: [0, 0],            
        UA: new Array(6).fill(0),
        D: new Array(16).fill(0),
        MS: new Array(24).fill(0)
    };

    // CPU 与 内存
    let uRAM = new Array(64).fill(0);   
    let mRAM = new Array(256).fill(0);  
    let PC = 0, IR = 0;
    let R = { 0: 0, 1: 0, 2: 0 }; // Ax=0, Bx=1, Cx=2
    let DISP = null;
    let uAddr_led = 0;
    
    let cpuState = 'READY'; // 'READY', 'WAITING_INPUT'

    // 表 8-5 标准测试程序 (预装载，也可手动覆盖)
    const exp8_code = [
        0x0048, 0x0005, 0x0001, 0x0094, 0x00F0, 0x0082, 0x0046, 0x0008, 0x0000
    ];

    // --- 界面渲染辅助 ---
    function createSwitches(containerId, count, prefix, stateArray) {
        const container = document.getElementById(containerId);
        for(let i = 0; i < count; i++) {
            let label = "";
            if (prefix === 'K' || prefix === 'CA') label = prefix + (i + 1); 
            else if (prefix === 'UA') label = 'UA' + (count - i - 1); 
            else if (prefix === 'D') label = 'D' + (count - i - 1);  
            else if (prefix === 'MS') label = 'MS' + (count - i);     
            
            let html = `
                <div class="switch-wrapper">
                    <div class="switch off" id="sw-${prefix}-${i}" onclick="toggleSwitch('${prefix}', ${i})">
                        <div class="toggle"></div>
                    </div>
                    <div class="switch-label">${label}</div>
                </div>
            `;
            container.innerHTML += html;
        }
    }

    createSwitches('bank-ctrl', 4, 'K', state.K);
    document.getElementById('bank-ctrl').innerHTML += `<div style="width: 30px;"></div>`;
    createSwitches('bank-ctrl', 2, 'CA', state.CA);
    createSwitches('bank-ua', 6, 'UA', state.UA);
    createSwitches('bank-d', 16, 'D', state.D);
    createSwitches('bank-ms', 24, 'MS', state.MS);

    function toggleSwitch(prefix, index) {
        state[prefix][index] = 1 - state[prefix][index]; 
        document.getElementById(`sw-${prefix}-${index}`).className = state[prefix][index] ? 'switch on' : 'switch off';
        updateModeBadge();
    }

    function getVal(arr) { return parseInt(arr.join(''), 2); }

    function log(msg) {
        const logEl = document.getElementById('sys-log');
        logEl.innerHTML += `<div>> ${msg}</div>`;
        logEl.scrollTop = logEl.scrollHeight;
    }

    function toHex(num, padding) { return num.toString(16).toUpperCase().padStart(padding, '0') + ' H'; }

    function updateDisplays() {
        document.getElementById('disp-uaddr').innerText = uAddr_led.toString(2).padStart(6, '0');
        document.getElementById('disp-pc').innerText = toHex(PC, 2);
        document.getElementById('disp-ir').innerText = toHex(IR, 4);
        document.getElementById('disp-ax').innerText = toHex(R[0], 4);
        document.getElementById('disp-bx').innerText = toHex(R[1], 4);
        document.getElementById('disp-cx').innerText = toHex(R[2], 4);
        document.getElementById('disp-out').innerText = DISP !== null ? toHex(DISP, 4).replace(' H', '') : '----';
    }

    function updateModeBadge() {
        let [K1, K2, K3, K4] = state.K;
        let [CA1, CA2] = state.CA;
        const badge = document.getElementById('mode-badge');
        
        if (!K1 && K2 && !K3 && K4) {
            badge.innerText = "模式: ✍️ 写微代码 (K1-4: 0101)"; badge.style.background = "#d97706";
        } else if (!K1 && !K2 && K3 && !K4) {
            badge.innerText = "模式: 📖 读微代码 (K1-4: 0010)"; badge.style.background = "#2563eb";
        } else if (K1 && !K2 && K3 && !K4) {
            if (CA1 && !CA2) {
                badge.innerText = "模式: 💾 写机器指令 (CA: 10)"; badge.style.background = "#059669";
            } else if (!CA1 && !CA2) {
                badge.innerText = "模式: 🔍 读机器指令 (CA: 00)"; badge.style.background = "#4f46e5";
            } else if (CA1 && CA2) {
                badge.innerText = "模式: 🚀 运行程序 (CA: 11)"; badge.style.background = "#7c3aed";
            }
        } else {
            badge.innerText = "模式: 未知/空闲"; badge.style.background = "#374151";
        }
    }

    // --- 核心动作逻辑 ---
    function actionCLR() {
        PC = 0; IR = 0; uAddr_led = 0; cpuState = 'READY';
        log("🔄 触发 CLR: PC=00H, IR=0000H, 解除阻塞。");
        updateDisplays();
    }

    function actionStep() {
        let [K1, K2, K3, K4] = state.K;
        let [CA1, CA2] = state.CA;

        // 1. 写微代码 (K=[0,1,0,1])
        if (!K1 && K2 && !K3 && K4) {
            let ua = getVal(state.UA);
            let ms = getVal(state.MS);
            uRAM[ua] = ms;
            uAddr_led = ua;
            log(`[写微代码] UA:${ua.toString(2).padStart(6,'0')} <- ${ms.toString(16).toUpperCase()}H`);
        }
        
        // 2. 读微代码 (K=[0,0,1,0])
        else if (!K1 && !K2 && K3 && !K4) {
            let ua = getVal(state.UA);
            uAddr_led = ua;
            log(`[读微代码] UA:${ua.toString(2).padStart(6,'0')} 内容: ${uRAM[ua].toString(16).toUpperCase()}H`);
        }
        
        // 3. 机器级操作 (K=[1,0,1,0])
        else if (K1 && !K2 && K3 && !K4) {
            
            // 3.1 写机器指令 (CA1=1, CA2=0)
            if (CA1 && !CA2) {
                let d = getVal(state.D);
                mRAM[PC] = d;
                log(`[写指令] RAM[${toHex(PC,2)}] <- ${toHex(d,4)}`);
                PC++;
                uAddr_led = 0b010100; // 模拟灯显
            }
            
            // 3.2 读机器指令 (CA1=0, CA2=0)
            else if (!CA1 && !CA2) {
                let val = mRAM[PC];
                log(`[读指令] RAM[${toHex(PC,2)}] = ${toHex(val,4)}`);
                PC++;
            }
            
            // 3.3 运行程序 (CA1=1, CA2=1)
            else if (CA1 && CA2) {
                // 预装载防迷路
                if(PC === 0 && mRAM[0] === 0) {
                    for(let i=0; i<exp8_code.length; i++) mRAM[i] = exp8_code[i];
                    log("<span class='log-succ'>*已自动装载表8-5标准程序至RAM*</span>");
                }

                if (cpuState === 'WAITING_INPUT') {
                    let val = getVal(state.D);
                    R[0] = val; // IN Ax
                    log(`📥 键盘开关输入数据: ${toHex(val,4)} -> Ax`);
                    cpuState = 'READY';
                    uAddr_led = 0;
                    updateDisplays();
                    return;
                }

                executeISA();
            }
        } else {
            log("<span class='log-warn'>⚠️ 开关状态不匹配任何有效操作，请检查 K1-K4 状态。</span>");
        }
        
        updateDisplays();
    }

    // --- 实验八 复杂模型机 ISA 核心 ---
    function executeISA() {
        IR = mRAM[PC];
        log(`[取指] PC=${toHex(PC,2)}, IR=${toHex(IR,4)}`);
        PC++;

        // 单字长指令操作码在低8位
        let op = IR & 0xFF;          
        let rs = (op >> 2) & 0x03;   
        let rd = op & 0x03;          
        
        if (op === 0x48) { // IN Ax, KIN
            log("<span class='log-warn'>⏳ IN指令挂起：微地址灯显示 010100。请拨动 D15-D0 输入数据，然后再次按【单步】。</span>");
            cpuState = 'WAITING_INPUT';
            uAddr_led = 0b010100; 
            return; 
        }
        else if (op === 0x46) { // OUT DISP, Cx
            DISP = R[rd];
            log(`🌟 <span class='log-succ'>OUT指令：输出 ${toHex(DISP,4)} 到数码管</span>`);
        }
        else if (op === 0x05) { // MOV Bx, D
            let imm = mRAM[PC];
            R[rd] = imm;
            log(`[执行] MOV R${rd}, 立即数 ${toHex(imm,4)}`);
            PC++; 
        }
        else if (op === 0x08) { // JMP D
            let dest = mRAM[PC];
            log(`[执行] JMP 跳转到 ${toHex(dest,2)}`);
            PC = dest; 
        }
        else if (op === 0x94) { // ADD Ax, Bx
            log(`[执行] ADD: R${rd} = R${rd} + R${rs}`);
            R[rd] = (R[rd] + R[rs]) & 0xFFFF;
        }
        else if (op === 0xF0) { // ROL Ax
            log(`[执行] ROL: R${rd} 循环左移一位`);
            let val = R[rd];
            R[rd] = ((val << 1) & 0xFFFF) | (val >> 15);
        }
        else if (op === 0x82) { // MOV Cx, Ax
            log(`[执行] MOV R${rd}, R${rs}`);
            R[rd] = R[rs];
        }
        else {
            log(`<span class='log-warn'>⚠️ 未知指令 ${toHex(IR,4)}，CPU自动停机 (请按CLR复位)。</span>`);
            cpuState = 'HALT';
        }
    }

    updateModeBadge();
    updateDisplays();
</script>
</body>
</html>
